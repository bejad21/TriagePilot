name: tests

on:
  push:
  pull_request:

jobs:
  eval-harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas pyarrow numpy scipy requests pytest
      - run: python -m pytest -q -p no:cacheprovider
